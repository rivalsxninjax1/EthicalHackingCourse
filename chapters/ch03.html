<script id="deep-03">
Object.assign(GL,{"root":"The Linux superuser account (UID 0) that can do almost anything.","UID":"User ID: the number Linux uses internally to identify an account. 0 is root.","permission":"A rule saying who may read, write or execute a file or directory.","process":"A running program, with its own ID (PID) and owner.","service":"A program that runs in the background, waiting to serve requests.","shell":"The program that reads your typed commands, such as bash or PowerShell.","pipe":"The | symbol: sends one command’s output into another command’s input.","kernel":"The core of the operating system that controls hardware, processes and memory.","container":"An isolated process that shares the host’s kernel, packaged with its own filesystem.","hypervisor":"Software that runs virtual machines, each with its own kernel.","registry":"The Windows database of system and application settings.","PowerShell":"The Windows command-line shell whose commands work with objects."});
DEEP[3]={stage:2,level:"Level 2 · Understanding",
plan:["Block A, Concept (45 min): filesystem, users, permissions, processes, services; Windows equivalents.","Block B, Visual (45 min): terminal simulator, permission bits, pipes, how Docker starts a container.","Block C, Guided lab (60 min): build and inspect an Ubuntu lab machine.","Block D, Challenge (45 min): audit for dangerous permissions.","Block E, Quiz (15 min): eight questions."],
obj:["Navigate the Linux filesystem and say what lives in /etc, /var, /home and /tmp","Read and set permissions such as rw-r----- and 640","Inspect users, groups, {{process}}es, services and listening ports on Linux and Windows","Combine commands with a {{pipe}} and redirection","Explain the difference between a virtual machine and a {{container}}","Build and reset a disposable Ubuntu lab machine"],
why:["Every later module happens on a Linux or Windows machine: the target, the attacker workstation, or both.","Misconfigured permissions and services are among the most common real findings and the core of privilege escalation.","Administrators and developers use the same commands to troubleshoot and audit systems.","Defenders read process lists, service lists and logs during an incident."],
simple:"Linux and Windows are operating systems that decide who may do what. Every file has an owner and rules, every program runs as some user, and background programs called services keep the machine useful. Learning to look around a system is the foundation of testing it.",
tech:["Linux treats nearly everything as a file in one tree starting at /. Configuration lives in /etc, logs in /var/log, user data in /home and temporary files in /tmp.","Each account has a {{UID}}; {{root}} is UID 0. /etc/passwd lists accounts and is world-readable; password hashes live in /etc/shadow, readable only by root and the shadow group.","A file mode has three groups (owner, group, others) of three bits: read 4, write 2, execute 1. 640 means owner read and write, group read, others nothing. On a directory, execute means permission to enter it.","A {{process}} is a running program with an owner. A {{service}} is a process that runs in the background. On most modern Linux systems services are managed by systemd (systemctl).","Windows has users and groups, services (Get-Service), processes (Get-Process), the {{registry}}, NTFS permissions and event logs in Event Viewer. {{PowerShell}} returns objects, not plain text.","Containers share the host’s {{kernel}}; virtual machines run their own kernel on a {{hypervisor}}. Containers start faster and are lighter, VMs isolate more strongly."],
dive:["The kernel enforces permissions on every file access. Privilege escalation (Module 10) is any way of gaining more than you were given.","setuid and setgid run a program with its owner’s or group’s privileges. Misused, they are a classic weakness. Module 10 covers them.","Docker Desktop on macOS and Windows runs a small Linux VM, and your containers run inside it. That is why networking and file sharing differ from native Linux.","Windows User Account Control, integrity levels and access tokens decide what a running process may do. Module 10 returns to them."],
ana:"An office building. Directories are rooms, files are cabinets, permissions are who holds which keys, processes are staff at work, services are the reception desk that is always open, and root is the facilities manager with a master key.",
anaStop:"On a computer a program can run as a different person, one misplaced permission can expose a cabinet to everyone, and the master key can be copied by anything that gains it.",
viz:[
{t:"Linux terminal (try the buttons or type)",prompt:"student@lab:~$",cmds:{"whoami":"student","id":"uid=1001(student) gid=1001(student) groups=1001(student)","pwd":"/home/student","ls -l":"total 4\n-rw-r--r-- 1 student student 18 Oct  5 10:00 notes.txt\ndrwxr-xr-x 2 student student 4096 Oct  5 10:00 projects","ls -l /etc/passwd /etc/shadow":"-rw-r--r-- 1 root root    1021 Oct  5 09:12 /etc/passwd\n-rw-r----- 1 root shadow   623 Oct  5 09:12 /etc/shadow","cat /etc/shadow":"cat: /etc/shadow: Permission denied","grep student /etc/passwd":"student:x:1001:1001::/home/student:/bin/sh","echo $PATH":"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin","ps aux | head -n 3":"USER      PID %CPU %MEM COMMAND\nroot        1  0.0  0.1 bash\nstudent    42  0.0  0.0 ps aux","ss -tln":"State  Recv-Q Send-Q Local Address:Port  Peer Address:Port\nLISTEN 0      4096   127.0.0.1:3000     0.0.0.0:*","chmod 600 notes.txt":"(no output: success is silent. ls -l would now show -rw-------)"}},
{t:"Reading a permission string: -rw-r-----",items:[{n:"Type (first character)",w:"- is a regular file, d is a directory, l is a link.",r:"Is this a file I can read, a directory I can enter, or a link to somewhere else?",c:"Know what each path really is before changing it."},{n:"Owner: rw- (6)",w:"The owner may read (4) and write (2) but not execute. 4+2=6.",r:"Who owns this, and what do they control?",c:"Give ownership to the service account that needs it, not to root by default."},{n:"Group: r-- (4)",w:"Members of the file’s group may read only.",r:"Which groups am I in, and which files do they unlock?",c:"Keep groups small and purposeful; audit membership."},{n:"Others: --- (0)",w:"Everyone else gets nothing. This is the safe default for secrets.",r:"Is anything readable or writable by everyone?",c:"Secrets get 600 or 640. Never 777."},{n:"Directory execute bit",w:"On a directory, x means you may enter it and reach files inside.",r:"Can I traverse the path to the file?",c:"Restrict directories as well as files."},{n:"Special bits (preview)",w:"setuid (an s in the owner position) runs a program as its owner, often root.",r:"Which programs run with more privilege than the user who starts them?",c:"Keep the list of setuid programs short and audited. Module 10 covers this."}]},
{t:"Linux filesystem: click a directory",items:[{n:"/etc",w:"System-wide configuration: accounts, services, network settings.",r:"Which configuration files can I read, and which can I change?",c:"Only root writes here; monitor for changes."},{n:"/var/log",w:"Logs from the system and services.",r:"What do the logs reveal, and would my activity appear in them?",c:"Central log collection; protect logs from tampering."},{n:"/home",w:"One directory per user: documents, keys, shell history.",r:"Is there anything sensitive here, such as keys or tokens?",c:"Private mode (700), no secrets in plain files."},{n:"/tmp",w:"Temporary files that any user can create.",r:"Is anything here readable or writable by everyone?",c:"Do not store sensitive data in /tmp; clean it regularly."},{n:"/usr/bin and /bin",w:"Installed programs. Your shell’s PATH decides which one runs when you type a name.",r:"Can I influence which program gets run?",c:"Keep PATH short and trusted; no writable directories first."},{n:"/proc",w:"A virtual view of running processes and kernel information, not real files on disk.",r:"What can I learn about running processes?",c:"Kernel and container hardening limit what users can see."}]},
{t:"A pipe in action: curl -s http://127.0.0.1:3000 | grep -i title",actors:["Shell","curl","grep","Terminal"],msgs:[{f:0,t:1,l:"start curl",n:"The {{shell}} starts curl and connects its output to a {{pipe}} instead of the screen."},{f:0,t:2,l:"start grep",n:"It also starts grep with its input connected to the other end of that pipe."},{f:1,t:2,l:"HTML text →",n:"curl writes the web page to its standard output, which flows through the pipe into grep’s standard input. Nothing is stored in a file."},{f:2,t:3,l:"matching line",n:"grep keeps only matching lines and prints them. Redirection (> file or >> file) would send them to a file instead: > overwrites, >> appends.",d:"Be careful: > can destroy a file’s contents. Check the filename before you run it."}]},
{t:"What happens when you type: docker run -it --rm ubuntu:24.04 bash",actors:["docker CLI","Docker daemon","Image registry","Container"],msgs:[{f:0,t:1,l:"run ubuntu:24.04",n:"The command-line tool asks the Docker daemon to start a container from that image. On macOS and Windows the daemon runs inside a small Linux VM.",d:"Whoever can talk to the Docker daemon effectively controls the host. Do not expose it."},{f:1,t:2,l:"image present?",n:"If the image is not stored locally, the daemon asks the registry for it. Ubuntu publishes arm64 and amd64 builds."},{f:2,t:1,l:"image layers",n:"The registry returns the image’s layers, which are cached for next time.",d:"Prefer official images and pinned versions; unknown images are untrusted code."},{f:1,t:3,l:"create and start",n:"The daemon creates an isolated process with its own filesystem, network and process list, sharing the host’s {{kernel}}, and starts bash in it. With --rm it is deleted on exit: your reset button.",d:"Run as a non-root user where possible."}]},
{t:"Windows: click a component",items:[{n:"Users and groups",w:"Accounts and groups such as Administrators. Check with whoami /groups or Get-LocalUser.",r:"Which account am I, and which powerful groups am I in?",c:"Standard accounts for daily work; few administrators."},{n:"Processes",w:"Running programs. View with Task Manager, tasklist or Get-Process.",r:"What runs, as which user, and what looks out of place?",c:"Endpoint protection and logging of process creation."},{n:"Services",w:"Background programs, many running as SYSTEM. View with Get-Service.",r:"Which services run with high privilege, and who can change them?",c:"Least-privilege service accounts; restrict who can modify services."},{n:"Registry",w:"A hierarchical database of settings, including what runs at startup.",r:"Which settings control what runs, and who may edit them?",c:"Tight permissions; monitor important keys."},{n:"Event Viewer",w:"Windows logs. In the Security log, event 4624 is a successful logon and 4625 a failed one. Reading it needs administrator rights.",r:"Would my sign-in attempts show up here?",c:"Collect these events centrally and alert on repeated failures."},{n:"Filesystem and UAC",w:"NTFS permissions control files; User Account Control asks before a process gets administrator rights.",r:"Which folders can a normal user write into that others execute from?",c:"Restrict write access to program folders; keep UAC on."}]}],
tables:[{t:"Same task, two systems",h:["Task","Linux","Windows"],r:[["Who am I?","whoami; id","whoami; whoami /groups"],["Network settings","ip addr","ipconfig /all"],["Listening ports","ss -tln","netstat -ano; Get-NetTCPConnection -State Listen"],["Running programs","ps aux","tasklist; Get-Process"],["Services","systemctl list-units --type=service","Get-Service"],["Find text","grep -ri word path","Select-String -Path path -Pattern word"],["Logs","/var/log; journalctl","Event Viewer; Get-WinEvent"]]},{t:"Permission numbers",h:["Number","Meaning","Typical use"],r:[["7 (rwx)","read, write, execute","Owner of a program or directory"],["6 (rw-)","read, write","Owner of a data file"],["5 (r-x)","read, execute","Others for programs"],["4 (r--)","read only","Group for shared data"],["0 (---)","nothing","Secrets from everyone else"],["600 / 640","owner rw / owner rw, group r","Private files; shared secrets"],["755 / 700","owner rwx, others r-x / owner only","Programs; private directories"],["777","everyone can do everything","Almost never correct"]]},{t:"Virtual machine vs container",h:["","Virtual machine","Container"],r:[["Kernel","Its own","Shares the host’s"],["Startup","Seconds to minutes","Under a second to seconds"],["Isolation","Stronger","Weaker, since the kernel is shared"],["Best for","Windows, Active Directory, Kali, anything needing a full OS","Single disposable apps and services"]]},{t:"Can I do this on my device?",h:["Tool or task","macOS Apple Silicon","Windows","Linux"],r:[["Docker","✅ Works (runs in a VM)","✅ Works (WSL 2 or Hyper-V)","✅ Works natively"],["Wireshark","✅ Works","✅ Works (Npcap)","✅ Works"],["Burp Suite Community","✅ Works","✅ Works","✅ Works"],["Python and Nmap","✅ Works","✅ Works","✅ Works"],["x86 virtual machines","⚠️ Need emulation: slow. Prefer ARM64 guests","✅ Works","✅ Works"],["Kali Linux","⚠️ ARM64 Kali VM or Kali container","✅ VM, WSL or container","✅ VM or container"],["USB Wi-Fi adapter in monitor mode","⚠️ Varies by chipset and VM support","⚠️ Limited driver support","✅ Best support"]]}],
av:[["Identify the account and its groups","List processes and listening services","Read configuration and permissions for anything exposed or writable","Look for secrets in files and history","Note what would let me do more than I was given"],["Run services as unprivileged accounts","Set secrets to 600 or 640","Remove unneeded software and services","Audit world-writable files and setuid programs","Log authentication and process creation"]],
rules:[["Treat root with respect","As root you can delete the system with one typo. Do risky experiments only inside the disposable container."],["Fake secrets only","Use obviously fake keys such as NOT-A-REAL-KEY in labs. Never paste real passwords or tokens into a terminal, a note or a screenshot."],["Your machine, your rules","Inspect only systems you own or are authorised to test. Commands that only read are still access."]],
roe:"LAB INVENTORY (one per machine)\nMachine:            ubuntu-lab (container)\nOS and CPU:         Ubuntu 24.04, aarch64 or x86_64\nCurrent user:       \nOther users:        \nListening ports:    \nRunning services:   \nWorld-writable files found:   \nNotes:",
tools:[{n:"A Linux shell and core commands",p:"ls, cd, cat, grep, find, chmod, ps and ss let you look at a system and change permissions.",u:"Every time you land on a Linux system.",c:"Running chmod -R or rm -r in the wrong directory.",s:"ls -l, id and ss -tln inside your container.",d:"Defenders audit permissions and listening services with the same tools."},{n:"PowerShell",p:"The Windows shell for inspecting users, processes, services and the network.",u:"Any Windows lab machine or workstation.",c:"Piping text when you should be selecting object properties.",s:"Get-Process | Select-Object -First 5",d:"Also the main tool for Windows administration and detection scripts."},{n:"Docker and Kali",p:"Docker gives you disposable Linux machines. Kali is a Linux distribution with security tools preinstalled.",u:"Docker for quick labs, Kali as your attack workstation VM.",c:"Keeping data you need inside a container you plan to delete.",s:"docker run -it --rm ubuntu:24.04 bash",d:"Container hardening is a core defensive skill."}],
try:[["1. What you need","Docker from Module 1 and a terminal. Windows users also need PowerShell, which is already installed. About 1 GB free disk."],["2. Install","Nothing new. The first run pulls a clean Ubuntu image; on Apple Silicon this downloads the arm64 build automatically."],["3. Setup","Start a disposable Ubuntu machine and add a few tools and a normal user. The prompt changes to root@… because you are root inside the container.","docker run -it --rm --name ubuntu-lab ubuntu:24.04 bash\napt update && apt install -y iproute2 procps curl\nuseradd -m student"],["4. Verify","Run these inside the container.","whoami\nid\nhead -n 2 /etc/os-release\nuname -m"],["5. Experiment","Look around the system the way a tester would.","ps aux | head -n 5\nss -tln\nls -l /etc/passwd /etc/shadow\ngrep student /etc/passwd\nrunuser -u student -- cat /etc/shadow"],["5b. Windows workstation alternative","Open PowerShell (normal, not administrator) and run the equivalents.","whoami /groups\nGet-Process | Select-Object -First 5\nGet-Service | Where-Object Status -eq Running | Select-Object -First 5\nGet-NetTCPConnection -State Listen | Select-Object -First 5 LocalAddress,LocalPort,OwningProcess\nGet-LocalUser"],["6. Observe","uname -m prints aarch64 on Apple Silicon and x86_64 on most PCs. /etc/passwd is world-readable (-rw-r--r--) and /etc/shadow is not (-rw-r----- root shadow). The student line looks like student:x:1001:1001::/home/student:/bin/sh, but numbers and shell may differ. The last command prints Permission denied. ss shows nothing listening because the container runs no services."],["7. Understand","The kernel checks the user’s UID against owner, group and others every time a file is opened. The x in /etc/passwd means the password is stored elsewhere, in /etc/shadow. root bypasses these checks, which is why root access is the goal of privilege escalation."],["8. Break it","Create a fake secret and make it writable by everyone. Then tamper with it as the unprivileged user.","mkdir /tmp/lab\necho 'api_key=NOT-A-REAL-KEY' > /tmp/lab/notes.txt\nchmod 777 /tmp/lab/notes.txt\nrunuser -u student -- sh -c 'echo tampered >> /tmp/lab/notes.txt'\ncat /tmp/lab/notes.txt"],["9. Fix it","Remove the write access and prove the user is blocked. Then leave the container; --rm deletes it, which resets your lab.","chmod 600 /tmp/lab/notes.txt\nrunuser -u student -- cat /tmp/lab/notes.txt\nexit"]],
check:["Started and exited an Ubuntu container","Ran whoami, id and uname -m","Read the permissions of /etc/passwd and /etc/shadow","Saw a normal user blocked from /etc/shadow","Made a file writable by everyone, then fixed it","Ran the PowerShell equivalents (or read them)"],
ch:{q:"Audit your Ubuntu container for files that any user can modify. Then explain why a root-run job that executes a script anyone can edit would be dangerous, and how to fix it.",h:["Permissions have a write bit for others. How would you search for it?","find with -perm -0002 matches files whose others-write bit is set. Try: find / -xdev -type f -perm -0002 2>/dev/null | head","If root runs a script that a normal user can edit, whose code actually runs?"],s:"The find command lists world-writable files. A script that root runs but anyone can edit lets a normal user change what root executes, so their code runs as root: privilege escalation. Fix: make the script and its directory owned by root and not writable by group or others (755 or 700), and monitor changes to it."},
proj:["Lab inventory sheet","Fill in the LAB INVENTORY template above for your Ubuntu container and for your own computer: OS, current user, other users, listening ports, running services and any world-writable files you found. One page each."],
mist:["Running experiments as root outside a disposable container","Using chmod 777 to make an error go away","Confusing > (overwrite) with >> (append)","Believing /etc/passwd contains password hashes","Treating a container as a hard security boundary","Using a real credential in a lab file","Forgetting that deleting a container also deletes its data"],
quiz:[{t:"mc",q:"What does mode 640 mean on a file?",o:["Everyone can read and write","Owner reads and writes, group reads, others have no access","Owner can only execute"],a:1,why:"6 is rw- for the owner, 4 is r-- for the group, 0 is --- for others."},{t:"tf",q:"Modern Linux stores password hashes in /etc/passwd.",a:1,why:"/etc/passwd is world-readable and lists accounts. The hashes live in /etc/shadow."},{t:"mc",q:"A script runs as root every night, and all users can edit it. What is the risk?",o:["It runs slowly","Any user can make root run their code","Nothing: root owns the machine anyway"],a:1,why:"Write access to something root executes is a path to root: privilege escalation."},{t:"mc",q:"You run echo hello > report.txt twice. What does report.txt contain?",o:["hello twice","hello once, because > overwrites","Nothing"],a:1,why:"> overwrites; >> appends."},{t:"mc",q:"Why is a container usually weaker isolation than a virtual machine?",o:["It has no filesystem","It shares the host’s kernel","It cannot use the network"],a:1,why:"A kernel flaw or misconfiguration can affect every container on the host."},{t:"mc",q:"Which Windows event ID records a failed logon in the Security log?",o:["4624","4625","1102"],a:1,why:"4624 is a successful logon, 4625 a failed one."},{t:"mc",q:"You cannot read /etc/shadow, but ls -l /etc/shadow works. Why?",o:["The file is encrypted","Listing an entry needs access to the directory, not the file’s contents","You are root"],a:1,why:"Reading metadata needs only access to the directory, not the file."},{t:"order",q:"Put the lab-safety cycle in order.",o:["Test the change as the other user","Create a fake secret file","Fix the permissions","Make the mistake on purpose (chmod 777)"],a:["Create a fake secret file","Make the mistake on purpose (chmod 777)","Test the change as the other user","Fix the permissions"],why:"Create the file, deliberately weaken it, prove the weakness, then fix and re-test."}],
recap:["Linux: everything is a file under /; users have UIDs; root is UID 0","Mode digits are r=4, w=2, x=1 for owner, group, others; secrets get 600 or 640","/etc/passwd lists accounts; /etc/shadow holds hashes","ps, ss, ls -l and grep let you look around; pipes join commands","Windows: users, services, processes, registry, Event Viewer, PowerShell","VMs have their own kernel; containers share the host’s","--rm makes a container a disposable lab"],
next:"You can now look around a Linux or Windows machine and reason about who may do what. Module 04 turns outward: reconnaissance and OSINT, learning what an organisation exposes before you touch anything.",
inst:[["Teaching notes and timing",["A (0:00 to 0:45) filesystem, users, permissions; B (0:45 to 1:30) terminal simulator and permission explorer; C (1:30 to 2:30) container lab, with a Windows group on PowerShell; D (2:30 to 3:15) audit challenge; E (3:15 to 3:30) quiz.","Talking point: permissions are checked on every file access, and almost every privilege escalation is a permission mistake."]],["Common student confusion",["Group vs others","Directory execute bit","> vs >>","Container vs VM","Why the x in /etc/passwd"]],["Discussion questions",["Why does a world-readable /etc/passwd not break security?","When is it acceptable to run as root?","Why is a container not a sandbox for hostile code?"]],["Instructor prompt: you land on an unknown Linux server. What do you want to know first?",["Who am I and which groups am I in","What OS and version","What is running and listening","What is writable by me","What logs exist and what would they record"]],["Lab troubleshooting",["apt update fails inside the container: check Docker has internet access","Prompt looks the same: check you ran docker run -it and see root@ in the prompt","Container disappeared: that is --rm; recreate it and repeat setup","Apple Silicon: ubuntu:24.04 has an arm64 build, so no emulation warning should appear"]]]};
